<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Flor de Liss</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #17121c, #30203b);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.box {
  width: 100%;
  max-width: 420px;
  background: white;
  border-radius: 22px;
  padding: 30px;
  box-shadow: 0 20px 60px #0008;
}

.logo {
  text-align: center;
  font-size: 28px;
  font-weight: bold;
}

.logo span {
  color: #a85cff;
}

h1 {
  text-align: center;
}

p {
  text-align: center;
  color: #666;
}

label {
  display: block;
  font-weight: bold;
  margin: 15px 0 6px;
}

input {
  width: 100%;
  padding: 13px;
  box-sizing: border-box;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #a85cff;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.erro {
  display: none;
  color: #b00020;
  text-align: center;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="box">

  <div id="login">

    <div class="logo">
      Flor de <span>Liss</span>
    </div>

    <h1>Painel de ADM</h1>
    <p>Acesso restrito</p>

    <label>Usuário</label>
    <input id="usuario" type="text">

    <label>Data de nascimento</label>
    <input id="data" type="text" placeholder="DD/MM/AAAA">

    <label>Senha</label>
    <input id="senha" type="password">

    <button onclick="entrar()">Entrar</button>

    <div id="erro" class="erro">
      Dados incorretos.
    </div>

  </div>

  <div id="painel" style="display:none">

    <div class="logo">
      Flor de <span>Liss</span>
    </div>

    <h1>Bem-vindo ao ADM!</h1>

    <p>
      Você entrou no painel administrativo da Flor de Liss.
    </p>

    <button onclick="sair()">Sair</button>

  </div>

</div>

<script>

function entrar() {

  const usuario = document.getElementById("usuario").value;
  const data = document.getElementById("data").value;
  const senha = document.getElementById("senha").value;

  if (
    usuario === "siteflordelisjv" &&
    data === "11/05/2016" &&
    senha === "flordelisoboticariojv"
  ) {

    document.getElementById("login").style.display = "none";
    document.getElementById("painel").style.display = "block";
    document.getElementById("erro").style.display = "none";

  } else {

    document.getElementById("erro").style.display = "block";

  }

}

function sair() {

  document.getElementById("painel").style.display = "none";
  document.getElementById("login").style.display = "block";

}

</script>

</body>
</html>
